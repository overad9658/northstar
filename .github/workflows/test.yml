name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar-test
          POSTGRES_DB: northstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://northstar:northstar-test@localhost:5432/northstar_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and tests
        run: npm run check
