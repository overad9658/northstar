name: Build and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to publish again (leave empty for current ref)
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to check out and publish
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,enable=${{ inputs.release-tag == '' }}
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=${{ inputs.release-tag }},enable=${{ inputs.release-tag != '' }}
            type=semver,pattern={{version}},value=${{ inputs.release-tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release-tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.release-tag || github.ref_name }}
            type=sha
            type=raw,value=latest,enable=${{ (inputs.release-tag != '' || startsWith(github.ref, 'refs/tags/v')) && !contains(inputs.release-tag || github.ref_name, '-') }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.description=Northstar: a lightweight, persistent priority matrix for engineering portfolios.
          cache-from: type=gha
          cache-to: type=gha,mode=max
