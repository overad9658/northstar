<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — Northstar</title><link rel="icon" href="/favicon.svg"><script src="/theme.js"></script><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"><script src="/login.js" type="module"></script></head>
<body class="auth-body"><main class="auth-shell"><a class="brand" href="/"><span class="brand-mark">N</span><span>Northstar</span></a><section class="auth-card"><p class="eyebrow" id="auth-kicker">Welcome back</p><h1 id="auth-title">Sign in</h1><p class="subtitle" id="auth-copy">Use your Northstar account to open the portfolio.</p><form id="auth-form"><label class="field"><span>Username</span><input name="username" autocomplete="username" required autofocus></label><label class="field"><span>Password</span><input name="password" type="password" minlength="10" maxlength="200" autocomplete="current-password" required></label><p class="form-error" id="auth-error" role="alert"></p><button class="button primary" id="auth-submit" type="submit">Sign in</button></form></section></main></body></html>
