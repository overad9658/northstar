<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Organize general tasks and project work on a flexible kanban board.">
    <title>Kanban board — Northstar</title>
    <link rel="icon" href="/favicon.svg">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <script src="/kanban.js" type="module"></script>
  </head>
  <body>
    <main class="app-shell kanban-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Northstar home"><span class="brand-mark">N</span><span>Northstar</span></a>
        <div class="topbar-actions"><button class="theme-toggle" data-theme-toggle type="button" aria-label="Switch to dark mode" aria-pressed="false"><span class="theme-icon-light" aria-hidden="true">☀</span><span class="theme-icon-dark" aria-hidden="true">☾</span></button><a class="button secondary button-link" href="/">← Priority matrix</a></div>
      </header>
      <section class="kanban-intro">
        <div><p class="eyebrow">Work board</p><h1>Keep work moving.</h1><p class="subtitle">Capture general to dos, or connect a card to a project when it belongs to one.</p></div>
        <form id="column-form" class="kanban-add-column"><label class="field"><span>New column</span><input name="name" maxlength="80" placeholder="e.g. To do" required></label><button class="button primary" type="submit">+ Add column</button></form>
      </section>
      <p class="form-error" id="board-error" role="alert"></p>
      <section id="kanban-board" class="kanban-board" aria-label="Kanban board"></section>
    </main>
    <dialog id="card-dialog" class="kanban-dialog" aria-labelledby="card-dialog-title">
      <form id="card-form">
        <header class="dialog-head"><div><p class="eyebrow" id="card-dialog-kicker">New card</p><h2 id="card-dialog-title">Add a card</h2></div><button class="icon-button" id="close-card-dialog" type="button" aria-label="Close">×</button></header>
        <label class="field wide"><span>Title</span><input name="title" maxlength="200" required placeholder="What needs to be done?"></label>
        <label class="field wide"><span>Details <small>Optional</small></span><textarea name="description" maxlength="2000" rows="4" placeholder="Add context or next steps"></textarea></label>
        <label class="field wide"><span>Column</span><select name="columnId" required></select></label>
        <label class="field wide"><span>Project <small>Optional</small></span><select name="projectId"><option value="">No project — general to do</option></select></label>
        <p class="form-error" id="card-error" role="alert"></p>
        <footer class="dialog-actions"><button class="delete-button" id="delete-card" type="button">Delete card</button><span></span><button class="button secondary" id="cancel-card" type="button">Cancel</button><button class="button primary" type="submit">Save card</button></footer>
      </form>
      <section class="kanban-notes" id="card-notes" hidden aria-labelledby="card-notes-title">
        <div class="kanban-notes-head"><h3 id="card-notes-title">Notes</h3><span id="note-count">0 notes</span></div>
        <div id="note-list" class="kanban-note-list"></div>
        <form id="note-form"><label class="field"><span>Add a note</span><textarea name="body" maxlength="2000" rows="3" required placeholder="Add an update or reminder"></textarea></label><p class="form-error" id="note-error" role="alert"></p><button class="button secondary" type="submit">Add note</button></form>
      </section>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
