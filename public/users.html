<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Users — Northstar</title><link rel="icon" href="/favicon.svg"><script src="/theme.js"></script><link rel="stylesheet" href="/styles.css"><script src="/users.js" type="module"></script></head><body><main class="app-shell team-settings-shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">N</span><span>Northstar</span></a><a class="button secondary button-link" href="/">← Priority matrix</a></header><section class="settings-intro"><p class="eyebrow">Access control</p><h1>Users and roles</h1><p class="subtitle">Admins manage all work. Team managers manage their teams and projects. Members can update their team boards.</p></section><section class="team-settings-card"><header class="settings-card-head"><div><h2>Accounts</h2><p>Use a unique username and a password of at least 10 characters.</p></div></header><form class="add-team-form" id="add-user-form"><label class="field"><span>Username</span><input name="username" required minlength="3" maxlength="80"></label><label class="field"><span>Password</span><input name="password" type="password" required minlength="10" maxlength="200"></label><label class="field"><span>Role</span><select name="role"><option value="read_only">Team member</option><option value="team_manager">Team manager</option><option value="admin">Admin</option></select></label><button class="button primary" type="submit">Add user</button></form><p class="form-error" id="user-error"></p><div class="team-settings-list" id="user-list"></div></section></main><div class="toast" id="toast"></div></body></html>
