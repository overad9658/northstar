<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Northstar HTTP API and MCP server reference.">
    <title>Docs — Northstar</title>
    <link rel="icon" href="/favicon.svg">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">

  <body>

      <section class="team-settings-card docs-layout">
        <nav class="docs-toc" id="docs-toc" aria-label="On this page"></nav>
