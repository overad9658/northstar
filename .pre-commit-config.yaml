minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

exclude: ^(node_modules|data|\.sbom|\.next|\.wrangler|\.pnpm-store)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
        # Public signing key used only by SSO tests.
        exclude: ^support/fixtures/sso-test-key\.pem$

  - repo: local
    hooks:
      - id: javascript-syntax
        name: Check JavaScript syntax
        entry: node support/check-syntax.mjs
        language: system
        files: \.(js|mjs)$
        pass_filenames: false
        require_serial: true

      - id: project-checks
        name: Run syntax checks and all tests
        entry: npm run check
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true
  